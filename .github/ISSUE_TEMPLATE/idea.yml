name: An idea
description: Something a product could do, or do better
labels: [idea]
body:
  - type: textarea
    id: need
    attributes:
      label: What you need
      description: The job you are trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How you picture it working. A sketch or screenshot is welcome.
